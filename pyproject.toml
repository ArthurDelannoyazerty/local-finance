[project]
name = "local-finance"
version = "0.2.0"
description = "A fast, self-hosted personal finance and FIRE dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.18.0",
    "fastapi>=0.116.0",
    "numpy>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "polars>=1.35.2",
    "pydantic>=2.11.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "yfinance>=0.2.66",
]

[project.scripts]
local-finance = "local_finance.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_finance"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
