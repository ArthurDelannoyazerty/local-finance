name: Clipboard branch formatting

on:
  push:
    branches:
      - feat/chart-clipboard-ui-cleanup-20261109
    paths:
      - .github/workflows/clipboard-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --frozen --dev
          npm ci --prefix frontend
      - name: Format sources with the project's locked tools
        run: |
          uv run --frozen ruff format src/local_finance tests
          cd frontend
          ./node_modules/.bin/prettier --write src
      - name: Commit only formatting on this feature branch
        run: |
          if git diff --quiet -- frontend/src src/local_finance tests; then
            exit 0
          fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src src/local_finance tests
          git commit -m 'style: apply locked Prettier and Ruff formatters'
          git push origin HEAD:refs/heads/feat/chart-clipboard-ui-cleanup-20261109
      - name: Backend lint and tests
        run: |
          uv run --frozen ruff check src/local_finance tests
          uv run --frozen pytest
      - name: Frontend tests, types and build
        run: |
          cd frontend
          npm test
          npm run typecheck
          npm run build
